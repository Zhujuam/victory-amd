name: Build Windows Release
on:
  workflow_dispatch:
  push:
    branches: [ victory-amd ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Vulkan SDK
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.268.0/windows/VulkanSDK-1.3.268.0-Installer.exe" -OutFile vulkan.exe
          .\vulkan.exe /S
          echo "VULKAN_SDK=C:\VulkanSDK\1.3.268.0" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\1.3.268.0\Bin" >> $env:GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo xtask build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: victory-amd-exe
          path: target/release/victory.exe
